<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Calculadora PWA simples, rápida e offline.">
<title>Calculadora PWA</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111827;--key:#243041;--op:#1d4ed8;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 10%,rgba(37,99,235,.2),transparent 35%),var(--bg);color:var(--text);display:grid;place-items:center;padding:18px}.app{width:min(100%,420px);background:rgba(17,24,39,.96);border:1px solid rgba(255,255,255,.07);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35)}.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 8px;gap:10px}.brand{font-weight:800;font-size:1.08rem}.install{border:0;border-radius:999px;padding:10px 14px;background:#e2e8f0;color:#0f172a;font-weight:800;cursor:pointer}.display{min-height:150px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;text-align:right;gap:8px}.expression{min-height:24px;color:var(--muted);word-break:break-all}.result{font-size:clamp(2.7rem,10vw,4.2rem);line-height:1;font-weight:800;word-break:break-all}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;background:rgba(15,23,42,.72)}.key{min-height:68px;border:0;border-radius:20px;background:var(--key);color:var(--text);font-size:1.35rem;font-weight:700;cursor:pointer}.key:active{transform:scale(.96)}.key.op{background:var(--op)}.key.equal{background:linear-gradient(135deg,#2563eb,#0ea5e9)}.key.clear{background:#4c1d1d;color:#fecaca}.key.zero{grid-column:span 2}.hint{text-align:center;color:#64748b;font-size:.78rem;padding:0 16px 14px;background:rgba(15,23,42,.72)}
</style>
</head>
<body>
<main class="app">
<div class="topbar"><div class="brand">Calculadora</div><button id="installBtn" class="install" hidden>Instalar app</button></div>
<section class="display" aria-live="polite"><div id="expression" class="expression">&nbsp;</div><div id="result" class="result">0</div></section>
<section class="keys">
<button class="key clear" data-action="clear">AC</button><button class="key" data-action="backspace">⌫</button><button class="key" data-value="%">%</button><button class="key op" data-value="/">÷</button>
<button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key op" data-value="*">×</button>
<button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key op" data-value="-">−</button>
<button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key op" data-value="+">+</button>
<button class="key zero" data-value="0">0</button><button class="key" data-value=".">,</button><button class="key equal" data-action="equals">=</button>
</section><div class="hint">Funciona offline após o primeiro acesso.</div>
</main>
<script>
const resultEl=document.getElementById('result'),expressionEl=document.getElementById('expression'),installBtn=document.getElementById('installBtn');let expression='',justCalculated=false,deferredPrompt=null;const operators=['+','-','*','/'];
function pretty(t){return t.replaceAll('*','×').replaceAll('/','÷').replaceAll('.',',')}function currentChunk(){return expression.split(/[+\-*/]/).pop()||''}function formatNumber(v){if(!Number.isFinite(v))return'Erro';if((Math.abs(v)!==0&&Math.abs(v)<1e-9)||Math.abs(v)>=1e12)return v.toExponential(8).replace('.',',');return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:10}).format(v)}function normalizePercent(e){return e.replace(/(\d+(?:\.\d+)?)%/g,'($1/100)')}function evaluate(e){try{const n=normalizePercent(e);if(!/^[0-9+\-*/().\s]+$/.test(n))return null;const v=Function('"use strict";return ('+n+')')();return Number.isFinite(v)?v:null}catch{return null}}function update(){expressionEl.textContent=expression?pretty(expression):'\u00A0';if(!expression){resultEl.textContent='0';return}if(!operators.includes(expression.at(-1))){const v=evaluate(expression);if(v!==null)resultEl.textContent=formatNumber(v)}}function append(v){if(justCalculated&&!operators.includes(v)){expression='';justCalculated=false}if(operators.includes(v)){justCalculated=false;if(!expression&&v!=='-')return;if(operators.includes(expression.at(-1)))expression=expression.slice(0,-1)+v;else expression+=v}else if(v==='.'){if(currentChunk().includes('.'))return;if(!expression||operators.includes(expression.at(-1)))expression+='0';expression+=v}else if(v==='%'){if(!expression||operators.includes(expression.at(-1))||expression.endsWith('%'))return;expression+=v}else expression+=v;update()}function calculate(){if(!expression)return;let clean=expression;while(operators.includes(clean.at(-1)))clean=clean.slice(0,-1);const v=evaluate(clean);if(v===null){resultEl.textContent='Erro';return}expressionEl.textContent=pretty(clean)+' =';resultEl.textContent=formatNumber(v);expression=String(v);justCalculated=true}function clearAll(){expression='';justCalculated=false;update()}function backspace(){if(justCalculated)return clearAll();expression=expression.slice(0,-1);update()}
document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.value)append(b.dataset.value);if(b.dataset.action==='equals')calculate();if(b.dataset.action==='clear')clearAll();if(b.dataset.action==='backspace')backspace()});
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error))}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.hidden=true});window.addEventListener('appinstalled',()=>{installBtn.hidden=true});update();
</script>
</body></html>
